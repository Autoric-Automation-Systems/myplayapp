name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Valores de fumaça: nenhuma query é executada durante typecheck/lint/build.
      DATABASE_URL: postgresql://user:password@localhost:5432/myplayapp
      AUTH_SECRET: ci-secret
      AUTH_GOOGLE_ID: ci-client-id
      AUTH_GOOGLE_SECRET: ci-client-secret
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
